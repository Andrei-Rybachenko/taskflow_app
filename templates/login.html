{% extends "base.html" %}
{% block content %}
<h1>Вход</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/ui/login">
    <input name="username" placeholder="Электронная почта" autocomplete="username" required>
    <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
</form>

<p><a href="/ui/register">Регистрация</a></p>
{% endblock %}
